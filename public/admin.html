
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

<header class="navbar">
    <h2>🛍️ Mounika Shopping Mall</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">My Cart</a>
        <a href="orders.html">Orders</a>
        <a href="admin.html">Admin</a>
    </nav>
</header>

<section class="page-banner">
    <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=1400" alt="Shopping administration">
    <div class="banner-text">
        <h1>Admin Dashboard</h1>
        <p>Manage products, prices and stock.</p>
    </div>
</section>

<section class="container form-box">
    <h2>Product Management</h2>

    <form id="productForm">

        <label>Select Product ID for Update/Delete</label>
        <select id="productId">
            <option value="">Select Product ID</option>
        </select>

        <input type="text" id="productName" placeholder="Product Name" required>

        <label>Category</label>
        <select id="productCategory" required>
            <option value="">Select Category</option>
            <option>Clothing</option>
            <option>Footwear</option>
            <option>Accessories</option>
            <option>Beauty</option>
            <option>Home & Kitchen</option>
            <option>Kids</option>
        </select>

        <input type="number" id="productPrice" placeholder="Price" min="0.01" step="0.01" required>

        <textarea id="productDescription" placeholder="Product Description" required></textarea>

        <input type="number" id="productStock" placeholder="Available Stock" min="0" required>

        <button type="submit" class="btn">Add Product</button>
        <button type="button" id="updateProduct" class="btn update">Update Product</button>
        <button type="button" id="deleteProduct" class="btn delete">Delete Product</button>
        <button type="reset" class="btn secondary">Clear Form</button>
    </form>
</section>

<section class="container">
    <h2>All Products</h2>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody id="adminProductTable"></tbody>
        </table>
    </div>
</section>

<section class="container form-box">
    <h2>Manage Order Status</h2>

    <label>Select Order ID</label>
    <select id="adminOrderId">
        <option value="">Select Order ID</option>
    </select>

    <label>New Status</label>
    <select id="adminOrderStatus">
        <option>Pending</option>
        <option>Processing</option>
        <option>Shipped</option>
        <option>Delivered</option>
        <option>Cancelled</option>
    </select>

    <button type="button" id="updateOrderStatus" class="btn">
        Update Order Status
    </button>
</section>

<footer>
    <p>© 2026 Mounika Shopping Mall</p>
</footer>

<script src="script.js"></script>
</body>
</html>
